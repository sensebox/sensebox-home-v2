; senseBox:home v2 firmware
; See implementation-docs/IMPLEMENTATION_PLAN.md for the architecture and decisions.

[platformio]
default_envs = mcu_s2

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-Wno-missing-field-initializers
build_unflags =
	-std=gnu++11
	-std=gnu++14
	-std=gnu++2a
	-std=gnu++2b

; ---------------------------------------------------------------------------
; Device builds (senseBox MCU S2 / ESP32-S2)
; ---------------------------------------------------------------------------
[device]
; senseBox fork of pioarduino (Arduino-ESP32 3.x, ESP-IDF 5.x)
platform = https://github.com/sensebox/platform-espressif32/archive/refs/tags/1.0.0.zip
board = sensebox_mcu_esp32s2
framework = arduino
board_build.partitions = partitions.csv
; Own board variant: same pins as sensebox_mcu_esp32s2, but without the stock 5 s boot-button
; wait that switches to ota_1 (see variants/sensebox_home_v2/variant.cpp).
board_build.variants_dir = variants
board_build.variant = sensebox_home_v2
; Our own partition table replaces the TinyUF2 layout, so don't flash the TinyUF2 image.
board_upload.arduino.flash_extra_images =
monitor_speed = 115200
build_unflags =
	${common.build_unflags}
	-DARDUINO_USB_MSC_ON_BOOT=1
build_flags =
	${common.build_flags}
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=0
	; MCCI LMIC configuration (instead of lmic_project_config.h)
	-DARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
	-DCFG_eu868=1
	-DCFG_sx1276_radio=1
	-DDISABLE_PING
	-DDISABLE_BEACONS
	-DLMIC_ENABLE_DeviceTimeReq=1
	-DLMIC_ENABLE_onEvent=0
	-DLMIC_PRINTF_TO=Serial
	-DLMIC_DEBUG_LEVEL=0
lib_deps =
	bblanchon/ArduinoJson @ 7.4.3
	adafruit/Adafruit AHTX0 @ 2.0.6
	adafruit/Adafruit HDC1000 Library @ 2.0.2
	sensirion/Sensirion I2C SPS30 @ 1.0.0
	mcci-catena/MCCI LoRaWAN LMIC library @ 5.0.1
lib_ldf_mode = deep+

[env:mcu_s2]
extends = device

; Development build: uses config/olpe-template.json as default config when NVS is empty,
; and logs at debug level.
[env:mcu_s2_dev]
extends = device
build_flags =
	${device.build_flags}
	-DSBH_DEV_BUILD=1
board_build.embed_txtfiles =
	config/olpe-template.json

; ---------------------------------------------------------------------------
; Host unit tests (pure logic, no Arduino)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags =
	${common.build_flags}
	-DSBH_NATIVE=1
build_unflags = ${common.build_unflags}
lib_deps =
	bblanchon/ArduinoJson @ 7.4.3
lib_ldf_mode = deep+
lib_ignore =
	board
	drivers
	system
	lorawan
